spring:
  application:
    name: clinic

  data:
    mongodb:
      uri: ${MONGO_URI}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            # Must match SecurityConfig redirectionEndpoint baseUri
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"

server:
  port: 8080

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  max-image-mb: 5
  max-pdf-mb: 10

payhere:
  sandbox: true
  merchant-id: ${PAYHERE_MERCHANT_ID}
  merchant-secret: ${PAYHERE_MERCHANT_SECRET}
  currency: LKR
  return-url: ${FRONTEND_URL}/payment/success
  cancel-url: ${FRONTEND_URL}/payment/cancel
  notify-url: ${BACKEND_URL}/api/payments/payhere/notify

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: 604800000

app:
  frontend-url: ${FRONTEND_URL}
  base-url: ${BACKEND_URL}

  oauth2:
    # Spring's SuccessHandler/FailureHandler will redirect here
    redirect-uri: https://www.mediclinic.krishanidhanushika.com/oauth2/callback

  reminder:
    cron: "0 */5 * * * *"

resend:
  api:
    key: ${RESEND_API_KEY}